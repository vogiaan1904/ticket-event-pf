name: ts-tests

# Unit tests only: they mock every collaborator, so the runner needs no
# database, broker or network.
on:
  push:
    branches: [main, dev]
    paths:
      - "services/api-gateway/**"
      - "services/event-svc/**"
      - "services/payment-svc/**"
      - "services/user-svc/**"
      - ".github/workflows/ts-tests.yml"
  pull_request:
    paths:
      - "services/api-gateway/**"
      - "services/event-svc/**"
      - "services/payment-svc/**"
      - "services/user-svc/**"
      - ".github/workflows/ts-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  payment-svc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment-svc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the service Dockerfiles; @types/node is 22, the runtime is not.
          node-version: "20"

      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - run: npm test

  api-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the service Dockerfiles; @types/node is 22, the runtime is not.
          node-version: "20"

      - run: npm ci

      - run: npm test

  user-svc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user-svc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the service Dockerfiles; @types/node is 22, the runtime is not.
          node-version: "20"

      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - run: npm test

  event-svc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/event-svc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the service Dockerfiles; @types/node is 22, the runtime is not.
          node-version: "20"

      - run: npm ci

      # Every TS service with a schema generates its client; api-gateway is the
      # only one without one. Here the schema is the prisma/schema/ folder.
      - name: Generate the Prisma client
        run: npx prisma generate

      - run: npm test
