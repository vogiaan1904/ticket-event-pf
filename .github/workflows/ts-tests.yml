name: ts-tests

# Unit tests mock every collaborator. A repository suite runs against a real
# Postgres, given here as a service; without its URL it fails rather than skip.
on:
  push:
    branches: [main, dev]
    paths:
      - "services/api-gateway/**"
      - "services/event-svc/**"
      - "services/payment-svc/**"
      - "services/user-svc/**"
      - ".github/workflows/ts-tests.yml"
  pull_request:
    paths:
      - "services/api-gateway/**"
      - "services/event-svc/**"
      - "services/payment-svc/**"
      - "services/user-svc/**"
      - ".github/workflows/ts-tests.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  payment-svc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment-svc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the service Dockerfiles; @types/node is 22, the runtime is not.
          node-version: "20"

      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - run: npm test

  api-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the service Dockerfiles; @types/node is 22, the runtime is not.
          node-version: "20"

      - run: npm ci

      - run: npm test

  user-svc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user-svc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the service Dockerfiles; @types/node is 22, the runtime is not.
          node-version: "20"

      - run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      - run: npm test

  event-svc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/event-svc
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: ticketbottle_event_test
        ports:
          # 5434, as docker-compose.dev.yml publishes it.
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U root -d ticketbottle_event_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EVENT_TEST_DATABASE_URL: postgresql://root:root@localhost:5434/ticketbottle_event_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the service Dockerfiles; @types/node is 22, the runtime is not.
          node-version: "20"

      - run: npm ci

      # Every TS service with a schema generates its client; api-gateway is the
      # only one without one. Here the schema is the prisma/schema/ folder.
      - name: Generate the Prisma client
        run: npx prisma generate

      - run: npm test
