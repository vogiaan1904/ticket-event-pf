# Rung 3 (ephemeral EKS). Layer on base values.yaml:
#   ./deploy/scripts/eks-deploy.sh
# which generates a second -f file carrying the account-specific bits
# (ECR registry, IRSA role ARN, ALB subnets, your IP).
target: eks

image:
  # registry and tag are injected at deploy time by eks-deploy.sh: the account id
  # stays out of git, and the tag is the immutable sha- build CI pushed.
  pullPolicy: IfNotPresent

# EKS has no working default StorageClass; deploy/k8s/eks/storageclass-gp3.yaml
# creates this one (EBS CSI, WaitForFirstConsumer, Delete).
storageClass: gp3

# Real AWS DynamoDB — no in-cluster dynamodb-local pod.
dynamodb:
  enabled: false

order:
  dynamodbEndpoint: ""     # empty -> default AWS endpoint
  awsRegion: us-east-1
  awsAccessKeyId: ""       # empty -> config.yaml omits creds -> web-identity (IRSA)
  awsSecretAccessKey: ""

serviceAccount:
  order:
    create: true
    name: order-service
    roleArn: ""            # injected at deploy time

# The gateway is fronted by an ALB, not a NodePort.
gateway:
  nodePort: null

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    # "ip" targets pod IPs directly via the VPC CNI — no NodePort hop.
    alb.ingress.kubernetes.io/target-type: ip
    # The gateway serves under APP_GLOBAL_PREFIX=api; "/" would 404 and every
    # target would be marked unhealthy.
    alb.ingress.kubernetes.io/healthcheck-path: /api
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: 200-399
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
  subnets: ""              # injected at deploy time
  inboundCidrs: ""         # injected at deploy time — the ALB is NOT world-open

# In-cluster payment path (simulated webhook + relay), same as Gates 1 and 2.
paymentEvents:
  enabled: true
outboxRelay:
  enabled: true

postgres:
  storage: 5Gi
redpanda:
  storage: 5Gi
redis:
  storage: 1Gi

# The gateway is the right first HPA target: stateless, HTTP-bound, no database
# lock contention, and scale-out is externally visible as target registrations
# in the ALB's target group.
#
# inventory-service is deliberately NOT autoscaled. Its reserve path holds
# `SELECT ... FOR UPDATE` on the ticket-class row, so throughput against one hot
# ticket class is bounded by lock hold time, not replica count — while each extra
# replica adds POSTGRES_MAX_OPEN_CONNS=25 against a server with the stock
# max_connections=100. Scaling it costs connections and buys no throughput.
autoscaling:
  app-gateway:
    enabled: true