# Source: ticketbottle/templates/apps/event.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: ticketbottle
  labels:
    app.kubernetes.io/part-of: ticketbottle
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels: { app: event-service }
  template:
    metadata:
      annotations:
        # Env is resolved at container creation, so a Secret change alone leaves
        # pods running the old values. The digest rolls them.
        checksum/secret: 720fb42bf60fc8e719f24a7d29d850b09379483d9a7bd4882c19b17c03c3d60d
      labels: { app: event-service }
    spec:
      containers:
        - name: event-service
          image: ticketbottle/event:dev
          imagePullPolicy: Always
          
          resources:
            limits:
              cpu: 500m
              memory: 384Mi
            requests:
              cpu: 50m
              memory: 128Mi
          envFrom:
            - configMapRef: { name: event-config }
            - secretRef: { name: event-secrets }
          ports: [{ containerPort: 50053 }]
          readinessProbe:
            tcpSocket: { port: 50053 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
