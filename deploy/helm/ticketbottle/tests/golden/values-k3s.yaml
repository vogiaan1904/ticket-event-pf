apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: ticketbottle
  labels:
    app.kubernetes.io/part-of: ticketbottle
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels: { app: temporal }
  template:
    metadata:
      annotations:
        # Env is resolved at container creation, so a Secret change alone leaves
        # the pod running the old password. The digest rolls it.
        checksum/secret: 4e3325a65db09c7e104ccbcf4a404ad65c6b5d29812b0bd1f0b442da211fc8b5
      labels: { app: temporal }
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.27.2
          
          resources:
            limits:
              cpu: "1"
              memory: 768Mi
            requests:
              cpu: 100m
              memory: 192Mi
          # auto-setup creates the temporal + temporal_visibility databases and schema
          # in the shared Postgres (needs the root superuser), then registers "default".
          env:
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_SEEDS, value: postgres }
            - { name: POSTGRES_USER, value: "root" }
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef: { name: temporal-secrets, key: POSTGRES_PWD }
            - { name: DBNAME, value: temporal }
            - { name: VISIBILITY_DBNAME, value: temporal_visibility }
            - { name: ENABLE_ES, value: "false" }
            - { name: SKIP_DB_CREATE, value: "false" }
            # Listen on all interfaces so the Service (and in-cluster clients like order-svc) can
            # reach the frontend. auto-setup defaults to 127.0.0.1, which the Service can't route to.
            - { name: BIND_ON_IP, value: "0.0.0.0" }
          ports: [{ containerPort: 7233 }]
          readinessProbe:
            exec:
              # Target localhost, NOT the Service name. The Service has no endpoints until
              # the pod is Ready, so a Service-addressed probe would deadlock (never Ready).
              command: ["tctl", "--address", "127.0.0.1:7233", "cluster", "health"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
