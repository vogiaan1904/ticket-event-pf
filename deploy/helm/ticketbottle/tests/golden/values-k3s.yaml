# Source: ticketbottle/templates/infra/postgres.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ticketbottle
  labels:
    app.kubernetes.io/part-of: ticketbottle
    app.kubernetes.io/managed-by: Helm
data:
  01-create-databases.sql: |
    SELECT 'CREATE DATABASE ticketbottle_user' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'ticketbottle_user')\gexec
    SELECT 'CREATE DATABASE ticketbottle_event' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'ticketbottle_event')\gexec
    SELECT 'CREATE DATABASE ticketbottle_payment' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'ticketbottle_payment')\gexec
    SELECT 'CREATE DATABASE ticketbottle_inventory' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'ticketbottle_inventory')\gexec
