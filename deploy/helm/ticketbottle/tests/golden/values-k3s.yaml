# Source: ticketbottle/templates/infra/redpanda.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: ticketbottle
  labels:
    app.kubernetes.io/part-of: ticketbottle
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels: { app: redpanda }
  template:
    metadata:
      labels: { app: redpanda }
    spec:
      # A dynamically provisioned EBS volume arrives root:root; the redpanda image runs
      # as non-root and cannot write its data dir. k3s local-path happened to create
      # world-writable directories, which hid this. fsGroup makes the chart portable.
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.2.7
          
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 1280Mi
          # NOTE: use args (not command) so the image ENTRYPOINT (/entrypoint.sh -> rpk)
          # is preserved. `rpk redpanda start` understands --mode/--kafka-addr; the raw
          # `redpanda` broker binary does not. Overriding command bypasses rpk and fails.
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            # advertise the in-cluster service name so clients reach the broker
            - --kafka-addr=PLAINTEXT://0.0.0.0:9093
            - --advertise-kafka-addr=PLAINTEXT://redpanda:9093
          ports:
            - { containerPort: 9093 }   # Kafka API
            - { containerPort: 9644 }   # Admin API (health)
          volumeMounts: [{ name: data, mountPath: /var/lib/redpanda/data }]
          readinessProbe:
            httpGet: { path: /v1/status/ready, port: 9644 }
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: "5Gi" } }
