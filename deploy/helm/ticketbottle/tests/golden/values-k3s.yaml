apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: ticketbottle
  labels:
    app.kubernetes.io/part-of: ticketbottle
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels: { app: temporal-ui }
  template:
    metadata:
      labels: { app: temporal-ui }
    spec:
      # The Service's name would inject TEMPORAL_UI_PORT=tcp://<ip>:8080, which the
      # UI reads as its own listen port. It finds the frontend by DNS, not links.
      enableServiceLinks: false
      containers:
        - name: temporal-ui
          image: temporalio/ui:2.34.0
          
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 25m
              memory: 32Mi
          # Reads the frontend over gRPC and calls no AWS API, so it needs no
          # IRSA and no instance-profile permission of its own.
          env:
            - { name: TEMPORAL_ADDRESS, value: "temporal:7233" }
            # The browser reaches the UI through `kubectl port-forward`, so the
            # only origin it ever sees is the local forwarded port.
            - { name: TEMPORAL_CORS_ORIGINS, value: "http://localhost:8233" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
