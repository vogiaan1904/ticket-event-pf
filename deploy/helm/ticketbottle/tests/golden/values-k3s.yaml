# Source: ticketbottle/templates/apps/config.yaml
apiVersion: v1
kind: ConfigMap
metadata: { name: payment-config, namespace: ticketbottle }
data:
  # No HOST key: payment main.ts binds 0.0.0.0 unconditionally and ignores it.
  PORT: "8085"
  GRPC_PORT: "50055"
  NAME: TicketBottle_Payment
  APP_GLOBAL_PREFIX: api
  NODE_ENV: development
  LOG_LEVEL: debug
  ZALOPAY_APP_ID: "2554"
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: ticketbottle_payment
  KAFKA_CLIENT_ID: payment-service
  KAFKA_BROKERS: redpanda:9093
  KAFKA_CONSUMER_GROUP_ID: payment-consumer-group
  KAFKA_SSL: "false"
  RELAY_SAFETY_POLL_MS: "5000"
  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_MAX_RETRIES: "5"
---
# Source: ticketbottle/templates/apps/config.yaml
apiVersion: v1
kind: ConfigMap
metadata: { name: order-config, namespace: ticketbottle }
data:
  ENV: development
  SERVER_GRPC_PORT: "50054"
  SERVER_READ_TIMEOUT: 30s
  SERVER_WRITE_TIMEOUT: 30s
  SERVER_IDLE_TIMEOUT: 60s
  # Bounds the wait on the CreateOrder saga. At 100 concurrent buyers on one hot
  # ticket class the slowest saga took 33s, so a 30s bound returned 504 for ~8%.
  ORDER_CREATE_TIMEOUT: "60s"
  DYNAMODB_TABLE_NAME: ticketbottle-orders
  AWS_REGION: "us-east-1"
  DYNAMODB_ENDPOINT: ""
  TEMPORAL_HOST_PORT: temporal:7233
  TEMPORAL_NAMESPACE: default
  JWT_EXPIRY: 15m
  LOG_LEVEL: debug
  LOG_MODE: development
  LOG_ENCODING: console
  KAFKA_BROKERS: redpanda:9093
  KAFKA_PRODUCER_RETRY_MAX: "3"
  KAFKA_PRODUCER_REQUIRED_ACKS: "1"
  KAFKA_ENABLED: "true"
  KAFKA_CONSUMER_GROUP_ID: order-service
  EVENT_SERVICE_ADDR: event-service:50053
  INVENTORY_SERVICE_ADDR: inventory-service:50057
  PAYMENT_SERVICE_ADDR: payment-service:50055
