# Fixed inputs for the golden renders. NOT credentials, and not used by any
# deploy — `assert-render.sh` passes this instead of deploy/secrets.values.yaml.
#
# Why: the goldens are committed, so rendering them with the real secrets file
# publishes every key to anyone who can read the repo, and makes the diff depend
# on whose machine ran it.
secrets:
  jwtSecret: "fixture-not-a-real-jwt-secret"
  jwtAccessSecret: "fixture-not-a-real-access-secret"
  jwtRefreshSecret: "fixture-not-a-real-refresh-secret"
  encryptKey: "fixture-not-a-real-encrypt-key"
  internalKey: "fixture-not-a-real-internal-key"
  adminPassword: "fixture-not-a-real-admin-password"
  postgresPassword: "fixture-not-a-real-postgres-password"
  zalopayKey1: "fixture-not-a-real-zalopay-key1"
  zalopayKey2: "fixture-not-a-real-zalopay-key2"
