{{- /* Its own file so temporal.yaml can checksum it without including itself. */ -}}
{{- if not (include "tb.pgSecretsManager" .) -}}
apiVersion: v1
kind: Secret
metadata: { name: temporal-secrets, namespace: {{ include "tb.namespace" . }} }
type: Opaque
stringData:
  POSTGRES_PWD: {{ include "tb.pgPassword" . | quote }}
{{- end }}
