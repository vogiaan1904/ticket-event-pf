apiVersion: v1
kind: Secret
metadata: { name: temporal-secrets, namespace: {{ include "tb.namespace" . }} }
type: Opaque
stringData:
  POSTGRES_PWD: {{ include "tb.pgPassword" . | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: {{ include "tb.namespace" . }}
  labels: {{- include "tb.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: temporal }
  template:
    metadata:
      labels: { app: temporal }
    spec:
      containers:
        - name: temporal
          image: {{ .Values.temporal.image }}
          {{- include "tb.resources" (dict "ctx" . "name" "temporal") | nindent 10 }}
          # auto-setup creates the temporal + temporal_visibility databases and schema
          # in the shared Postgres (needs the root superuser), then registers "default".
          env:
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_SEEDS, value: postgres }
            - { name: POSTGRES_USER, value: "{{ .Values.postgres.user }}" }
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef: { name: temporal-secrets, key: POSTGRES_PWD }
            - { name: DBNAME, value: temporal }
            - { name: VISIBILITY_DBNAME, value: temporal_visibility }
            - { name: ENABLE_ES, value: "{{ .Values.temporal.enableElasticsearch }}" }
            - { name: SKIP_DB_CREATE, value: "false" }
            # Listen on all interfaces so the Service (and in-cluster clients like order-svc) can
            # reach the frontend. auto-setup defaults to 127.0.0.1, which the Service can't route to.
            - { name: BIND_ON_IP, value: "0.0.0.0" }
          ports: [{ containerPort: 7233 }]
          readinessProbe:
            exec:
              # Target localhost, NOT the Service name. The Service has no endpoints until
              # the pod is Ready, so a Service-addressed probe would deadlock (never Ready).
              command: ["tctl", "--address", "127.0.0.1:7233", "cluster", "health"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: {{ include "tb.namespace" . }}
  labels: {{- include "tb.labels" . | nindent 4 }}
spec:
  selector: { app: temporal }
  ports: [{ port: 7233, targetPort: 7233 }]
{{- if .Values.temporal.ui.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: {{ include "tb.namespace" . }}
  labels: {{- include "tb.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: temporal-ui }
  template:
    metadata:
      labels: { app: temporal-ui }
    spec:
      # The Service's name would inject TEMPORAL_UI_PORT=tcp://<ip>:8080, which the
      # UI reads as its own listen port. It finds the frontend by DNS, not links.
      enableServiceLinks: false
      containers:
        - name: temporal-ui
          image: {{ .Values.temporal.ui.image }}
          {{- include "tb.resources" (dict "ctx" . "name" "temporal-ui") | nindent 10 }}
          # Reads the frontend over gRPC and calls no AWS API, so it needs no
          # IRSA and no instance-profile permission of its own.
          env:
            - { name: TEMPORAL_ADDRESS, value: "temporal:7233" }
            # The browser reaches the UI through `kubectl port-forward`, so the
            # only origin it ever sees is the local forwarded port.
            - { name: TEMPORAL_CORS_ORIGINS, value: "http://localhost:{{ .Values.temporal.ui.localPort }}" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: {{ include "tb.namespace" . }}
  labels: {{- include "tb.labels" . | nindent 4 }}
spec:
  # ClusterIP on purpose. The UI has no authentication and can terminate and
  # reset workflows, so it is never given a public listener; reach it with
  # `make -C deploy temporal-ui`.
  selector: { app: temporal-ui }
  ports: [{ port: 8080, targetPort: 8080 }]
{{- end }}
