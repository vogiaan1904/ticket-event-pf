apiVersion: v1
kind: ConfigMap
metadata: { name: user-config, namespace: {{ include "tb.namespace" . }} }
data:
  ENV: development
  HOST: "0.0.0.0"
  PORT: "50052"
  DATABASE_URL: postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/ticketbottle_user
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_USERNAME: {{ .Values.postgres.user }}
  DATABASE_PASSWORD: {{ .Values.postgres.password }}
  DATABASE_NAME: ticketbottle_user
---
apiVersion: v1
kind: ConfigMap
metadata: { name: event-config, namespace: {{ include "tb.namespace" . }} }
data:
  HOST: "0.0.0.0"
  GRPC_PORT: "50053"
  NAME: TicketBottle_Event
  APP_GLOBAL_PREFIX: api
  CORS_ORIGINS: "[]"
  DATABASE_URL: postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/ticketbottle_event
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_USERNAME: {{ .Values.postgres.user }}
  DATABASE_PASSWORD: {{ .Values.postgres.password }}
  DATABASE_NAME: ticketbottle_event
---
apiVersion: v1
kind: ConfigMap
metadata: { name: inventory-config, namespace: {{ include "tb.namespace" . }} }
data:
  ENV: development
  SERVER_GRPC_PORT: "50057"
  SERVER_READ_TIMEOUT: 30s
  SERVER_WRITE_TIMEOUT: 30s
  SERVER_IDLE_TIMEOUT: 60s
  LOG_LEVEL: info
  LOG_MODE: development
  LOG_ENCODING: console
  POSTGRES_URL: postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/ticketbottle_inventory?sslmode=disable
  POSTGRES_MAX_OPEN_CONNS: "25"
  POSTGRES_MAX_IDLE_CONNS: "10"
  POSTGRES_CONN_MAX_LIFETIME: 5m
  POSTGRES_CONN_MAX_IDLE_TIME: 10m
---
apiVersion: v1
kind: ConfigMap
metadata: { name: waitroom-config, namespace: {{ include "tb.namespace" . }} }
data:
  ENV: development
  SERVER_GRPC_PORT: "50056"
  SERVER_READ_TIMEOUT: 30s
  SERVER_WRITE_TIMEOUT: 30s
  SERVER_IDLE_TIMEOUT: 60s
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ""
  REDIS_DB: "0"
  REDIS_MAX_RETRIES: "3"
  REDIS_POOL_SIZE: "10"
  REDIS_MIN_IDLE_CONNS: "5"
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: redpanda:9093
  KAFKA_CONSUMER_GROUP_ID: waitroom-service
  KAFKA_PRODUCER_RETRY_MAX: "3"
  KAFKA_PRODUCER_REQUIRED_ACKS: "1"
  KAFKA_CONSUMER_SESSION_TIMEOUT: "10000"
  # In-place retries before a message is parked on <topic>.dlq; backoff doubles.
  KAFKA_CONSUMER_RETRY_MAX: "5"
  KAFKA_CONSUMER_RETRY_BACKOFF: 500ms
  QUEUE_DEFAULT_MAX_CONCURRENT: "100"
  QUEUE_DEFAULT_RELEASE_RATE: "10"
  QUEUE_PROCESS_INTERVAL: 1s
  QUEUE_SESSION_TTL: 7200s
  QUEUE_POSITION_UPDATE_INTERVAL: 5s
  EVENT_SERVICE_ADDR: event-service:50053
  JWT_EXPIRY: 15m
  LOGGER_LEVEL: debug
  LOGGER_MODE: development
  LOGGER_ENCODING: console
---
apiVersion: v1
kind: ConfigMap
metadata: { name: payment-config, namespace: {{ include "tb.namespace" . }} }
data:
  # HOST is hardcoded 0.0.0.0 in payment main.ts; do NOT pass the ngrok HOST from .env.payment.
  PORT: "8085"
  GRPC_PORT: "50055"
  NAME: TicketBottle_Payment
  APP_GLOBAL_PREFIX: api
  NODE_ENV: development
  LOG_LEVEL: debug
  ZALOPAY_APP_ID: "2554"
  DATABASE_URL: postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/ticketbottle_payment
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_USERNAME: {{ .Values.postgres.user }}
  DATABASE_PASSWORD: {{ .Values.postgres.password }}
  DATABASE_NAME: ticketbottle_payment
  KAFKA_CLIENT_ID: payment-service
  KAFKA_BROKERS: redpanda:9093
  KAFKA_CONSUMER_GROUP_ID: payment-consumer-group
  KAFKA_SSL: "false"
  RELAY_SAFETY_POLL_MS: "5000"
  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_MAX_RETRIES: "5"
---
apiVersion: v1
kind: ConfigMap
metadata: { name: order-config, namespace: {{ include "tb.namespace" . }} }
data:
  ENV: development
  SERVER_GRPC_PORT: "50054"
  SERVER_READ_TIMEOUT: 30s
  SERVER_WRITE_TIMEOUT: 30s
  SERVER_IDLE_TIMEOUT: 60s
  PAYMENT_TIMEOUT_SECONDS: "600"
  # Bounds the wait on the CreateOrder saga. At 100 concurrent buyers on one hot
  # ticket class the slowest saga took 33s, so a 30s bound returned 504 for ~8%.
  ORDER_CREATE_TIMEOUT: {{ .Values.order.createTimeout | quote }}
  DYNAMODB_TABLE_NAME: ticketbottle-orders
  AWS_REGION: {{ .Values.order.awsRegion | quote }}
  DYNAMODB_ENDPOINT: {{ .Values.order.dynamodbEndpoint | quote }}
  {{- if .Values.order.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.order.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.order.awsSecretAccessKey | quote }}
  {{- end }}
  TEMPORAL_HOST_PORT: temporal:7233
  TEMPORAL_NAMESPACE: default
  JWT_EXPIRY: 15m
  LOG_LEVEL: debug
  LOG_MODE: development
  LOG_ENCODING: console
  KAFKA_BROKERS: redpanda:9093
  KAFKA_PRODUCER_RETRY_MAX: "3"
  KAFKA_PRODUCER_REQUIRED_ACKS: "1"
  KAFKA_ENABLED: "true"
  KAFKA_CONSUMER_GROUP_ID: order-service
  EVENT_SERVICE_ADDR: event-service:50053
  INVENTORY_SERVICE_ADDR: inventory-service:50057
  PAYMENT_SERVICE_ADDR: payment-service:50055
---
apiVersion: v1
kind: ConfigMap
metadata: { name: gateway-config, namespace: {{ include "tb.namespace" . }} }
data:
  PORT: "3000"
  NAME: TicketBottle_Event
  APP_GLOBAL_PREFIX: api
  CORS_ORIGINS: {{ .Values.gateway.corsOrigins | quote }}
  JWT_ACCESS_EXPIRATION: 1d
  JWT_REFRESH_EXPIRATION: 7d
  JWT_REFRESH_SLIDING_WINDOW: 24h
  SALT_ROUND: "10"
  USER_SERVICE: user-service:50052
  EVENT_SERVICE: event-service:50053
  INVENTORY_SERVICE: inventory-service:50057
  ORDER_SERVICE: order-service:50054
  WAITROOM_SERVICE: waitroom-service:50056
  REDIS_URL: redis://redis:6379
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
