{{- if and .Values.apps.enabled .Values.serviceAccount.order.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.order.name }}
  namespace: {{ include "tb.namespace" . }}
  labels: {{- include "tb.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.order.roleArn }}
  annotations:
    # The EKS pod-identity webhook sees this and injects AWS_ROLE_ARN +
    # AWS_WEB_IDENTITY_TOKEN_FILE + a projected token volume into every pod using
    # this ServiceAccount. The Go AWS SDK then resolves credentials at chain step 3
    # (web identity) — which is why order-config must NOT set AWS_ACCESS_KEY_ID.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.order.roleArn | quote }}
  {{- end }}
{{- end }}