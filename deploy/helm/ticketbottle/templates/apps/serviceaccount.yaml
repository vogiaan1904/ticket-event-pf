{{- if .Values.apps.enabled }}
{{- range $key, $sa := .Values.serviceAccount }}
{{- if $sa.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa.name }}
  namespace: {{ include "tb.namespace" $ }}
  labels: {{- include "tb.labels" $ | nindent 4 }}
  {{- if $sa.roleArn }}
  annotations:
    # The EKS pod-identity webhook sees this and injects AWS_ROLE_ARN +
    # AWS_WEB_IDENTITY_TOKEN_FILE + a projected token volume into every pod using
    # this ServiceAccount, so no AWS key is ever configured.
    eks.amazonaws.com/role-arn: {{ $sa.roleArn | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
