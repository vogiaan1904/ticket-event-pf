{{- $pg := include "tb.pgSecretsManager" $ }}
{{- range $svc := list "user" "event" "payment" }}
{{- $host := index $.Values.postgres.hosts (include "tb.pgRole" $svc) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $svc }}-migrate
  namespace: {{ include "tb.namespace" $ }}
  labels: {{- include "tb.labels" $ | nindent 4 }}
  annotations:
    # Before an upgrade's rollout, so new code never reads a schema that is not there
    # yet; after a first install, when Postgres comes from this chart. See 0022.
    "helm.sh/hook": pre-upgrade,post-install
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      {{- with include "tb.saName" (dict "ctx" $ "key" $svc) }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- if $pg }}
      volumes:
        {{- include "tb.pgVolume" (dict "ctx" $ "svc" $svc) | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "tb.image" (dict "ctx" $ "repo" (printf "ticketbottle/%s-migrate" $svc)) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["sh","-c","npx prisma migrate deploy"]
          envFrom:
            - configMapRef: { name: {{ $svc }}-config }
            - secretRef: { name: {{ $svc }}-secrets }
          {{- if $pg }}
          env:
            {{- include "tb.pgEnv" (dict "ctx" $ "svc" $svc) | nindent 12 }}
          volumeMounts:
            {{- include "tb.pgMount" $ | nindent 12 }}
          {{- end }}
      # wait for postgres before running (hook order doesn't guarantee DB readiness)
      initContainers:
        {{- if $pg }}
        {{- include "tb.pgEnsureDb" (dict "ctx" $ "svc" $svc) | nindent 8 }}
        {{- else }}
        - name: wait-postgres
          image: postgres:15-alpine
          command: ["sh","-c","until pg_isready -h {{ $host }} -U {{ $.Values.postgres.user }}; do echo waiting for postgres; sleep 2; done"]
        {{- end }}
{{- end }}
