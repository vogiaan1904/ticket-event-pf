{{- /*
Signing keys, the service-to-service key and the admin bootstrap password.

These are deliberately NOT in config.yaml. A ConfigMap is world-readable to
anything with `get configmaps` in the namespace, it is dumped in full by
`kubectl describe`, and — the reason this file exists — a value written into a
committed template is published to everyone who can read the repository.

There are no defaults. `required` fails the render rather than substituting a
placeholder, because a chart that silently deploys a known-value signing key is
worse than one that refuses: order-service verifies the checkout token by
signature alone, with no callback to waitroom, so whoever holds JWT_SECRET can
mint a checkout for any user.

Supply them with `-f` from a file kept out of git:
    make -C deploy secrets-init      # writes deploy/secrets.values.yaml
*/ -}}
{{- if .Values.apps.enabled }}
apiVersion: v1
kind: Secret
metadata: { name: event-secrets, namespace: {{ include "tb.namespace" . }} }
type: Opaque
stringData:
  ENCRYPT_KEY: {{ required "secrets.encryptKey is required (make -C deploy secrets-init)" .Values.secrets.encryptKey | quote }}
---
apiVersion: v1
kind: Secret
metadata: { name: order-secrets, namespace: {{ include "tb.namespace" . }} }
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required (make -C deploy secrets-init)" .Values.secrets.jwtSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata: { name: waitroom-secrets, namespace: {{ include "tb.namespace" . }} }
type: Opaque
stringData:
  JWT_SECRET: {{ required "secrets.jwtSecret is required (make -C deploy secrets-init)" .Values.secrets.jwtSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata: { name: payment-secrets, namespace: {{ include "tb.namespace" . }} }
type: Opaque
stringData:
  ZALOPAY_KEY1: {{ required "secrets.zalopayKey1 is required (make -C deploy secrets-init)" .Values.secrets.zalopayKey1 | quote }}
  ZALOPAY_KEY2: {{ required "secrets.zalopayKey2 is required (make -C deploy secrets-init)" .Values.secrets.zalopayKey2 | quote }}
---
apiVersion: v1
kind: Secret
metadata: { name: gateway-secrets, namespace: {{ include "tb.namespace" . }} }
type: Opaque
stringData:
  ENCRYPT_KEY: {{ required "secrets.encryptKey is required (make -C deploy secrets-init)" .Values.secrets.encryptKey | quote }}
  JWT_ACCESS_SECRET: {{ required "secrets.jwtAccessSecret is required (make -C deploy secrets-init)" .Values.secrets.jwtAccessSecret | quote }}
  JWT_REFRESH_SECRET: {{ required "secrets.jwtRefreshSecret is required (make -C deploy secrets-init)" .Values.secrets.jwtRefreshSecret | quote }}
  INTERNAL_KEY: {{ required "secrets.internalKey is required (make -C deploy secrets-init)" .Values.secrets.internalKey | quote }}
  APP_INIT_ADMIN_PASSWORD: {{ required "secrets.adminPassword is required (make -C deploy secrets-init)" .Values.secrets.adminPassword | quote }}
{{- end }}
