{{- if and .Values.apps.enabled .Values.paymentEvents.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-webhook
  namespace: {{ include "tb.namespace" . }}
  labels: {{- include "tb.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-webhook }
  template:
    metadata:
      labels: { app: payment-webhook }
    spec:
      containers:
        - name: payment-webhook
          image: {{ include "tb.image" (dict "ctx" . "repo" "ticketbottle/payment-events") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "tb.resources" (dict "ctx" . "name" "payment-webhook") | nindent 10 }}
          command: ["node", "webhook.js"]
          envFrom:
            - configMapRef: { name: payment-config }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-webhook
  namespace: {{ include "tb.namespace" . }}
  labels: {{- include "tb.labels" . | nindent 4 }}
spec:
  selector: { app: payment-webhook }
  ports: [{ port: 8080, targetPort: 8080 }]
{{- end }}
