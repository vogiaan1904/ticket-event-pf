{{- /* One per Postgres host. A pod mounting it fetches the password under its own
       IRSA role and the driver syncs it into Secret pg-<host>. See _postgres.tpl. */ -}}
{{- if include "tb.pgSecretsManager" . }}
{{- range $host := list "payment" "inventory" "shared" }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: pg-{{ $host }}
  namespace: {{ include "tb.namespace" $ }}
  labels: {{- include "tb.labels" $ | nindent 4 }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: {{ required (printf "postgres.passwordArns.%s is required" $host) (index $.Values.postgres.passwordArns $host) | quote }}
        objectAlias: password
  secretObjects:
    - secretName: pg-{{ $host }}
      type: Opaque
      data:
        - { objectName: password, key: password }
{{- end }}
{{- end }}
