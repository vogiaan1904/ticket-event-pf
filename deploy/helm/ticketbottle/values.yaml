# Shared defaults. Overlays (values-k3s/-eks) override per target.
namespace: ticketbottle

image:
  registry: ""          # "<account>.dkr.ecr.us-east-1.amazonaws.com/", set via --set at deploy
  tag: dev              # the branch tag CI moves; EKS deploys an immutable "sha-..."
  pullPolicy: IfNotPresent

apps:
  # Set false (via --set) for an infra-only install — e.g. running a service
  # locally against in-cluster Postgres/Kafka/Temporal instead of in-pod.
  enabled: true

# "" -> the cluster's default StorageClass (k3s: local-path).
# EKS names "gp3" explicitly; see deploy/k8s/eks/storageclass-gp3.yaml.
storageClass: ""

# Signing keys, the service-to-service key and the admin bootstrap password.
# Deliberately empty — templates/apps/secrets.yaml calls `required` on each, so
# a deploy without them fails loudly instead of shipping a known-value key.
# Generate a local file and pass it with -f:  make -C deploy secrets-init
secrets:
  jwtSecret: ""
  jwtAccessSecret: ""
  jwtRefreshSecret: ""
  encryptKey: ""
  internalKey: ""
  adminPassword: ""
  postgresPassword: ""
  zalopayKey1: ""
  zalopayKey2: ""

postgres:
  image: postgres:15-alpine
  storage: 2Gi
  user: root
  # The password is a credential: see `secrets.postgresPassword` above. Changing
  # it does not rotate an initialised volume -- POSTGRES_PASSWORD only applies
  # at initdb, so an existing PVC keeps the password it was created with.
  # false where the database is external; the StatefulSet, its Service and the
  # init ConfigMap stop rendering and `hosts` below points at the real one.
  enabled: true
  # Which host each service's database lives on. All three are the in-cluster
  # Service by default; a target with an external database overrides them.
  hosts:
    payment: postgres
    inventory: postgres
    shared: postgres      # user, event, and Temporal's two databases
  # app databases created by the init ConfigMap (Temporal DBs are created by Temporal itself)
  databases:
    - ticketbottle_user
    - ticketbottle_event
    - ticketbottle_payment
    - ticketbottle_inventory

redis:
  image: redis:7-alpine
  storage: 1Gi

redpanda:
  image: redpandadata/redpanda:v24.2.7
  storage: 2Gi

paymentEvents:
  enabled: true

outboxRelay:
  enabled: true
  replicas: 1

order:
  createTimeout: 60s
  # Real DynamoDB on every target. Empty -> the AWS default endpoint, and no
  # static key, so the SDK reaches the instance profile (k3s) or IRSA (EKS).
  dynamodbEndpoint: ""
  awsRegion: us-east-1

temporal:
  image: temporalio/auto-setup:1.27.2
  enableElasticsearch: false   # SQL/Postgres visibility; Elasticsearch alone wants 1-2GB
  # auto-setup is the server only; the web UI is a separate image.
  ui:
    enabled: false
    image: temporalio/ui:2.34.0
    localPort: 8233   # the port `make temporal-ui` forwards to, and the only CORS origin

gateway:
  # JSON array of allowed browser origins. "*" is right for a local cluster with
  # no browser client; a target that serves one should name its origins.
  corsOrigins: '["*"]'
  # NodePort for k3s, reached through the SSH tunnel.
  # Set to null on EKS, where the Service becomes ClusterIP behind an ALB Ingress.
  nodePort: 30000
  # Proxies in front of the gateway: 0 on the NodePort, 1 behind the ALB. Too
  # many lets a client choose its own rate-limit key with X-Forwarded-For.
  trustProxyHops: 0
  # Sign-in and sign-up attempts per client IP per minute, per replica; 0 is off.
  authRateLimitPerMinute: 20

ingress:
  enabled: false
  className: alb
  annotations: {}
  subnets: ""       # comma-separated subnet ids; injected at deploy time
  inboundCidrs: ""  # comma-separated CIDRs allowed to reach the ALB; injected at deploy time

serviceAccount:
  order:
    # On EKS, order-api + order-consumer run under a dedicated ServiceAccount
    # annotated with an IRSA role. On k3s they use the namespace default SA.
    create: false
    name: order-service
    roleArn: ""     # injected at deploy time from `terraform output order_role_arn`

# --- Scheduling and scaling ---------------------------------------------------
# Keyed by WORKLOAD name, not service directory name — note payment-webhook
# (rendered by payment-events.yaml) and the two order Deployments.
#
# Requests schedule; limits throttle. CPU limits are ~10x the request so a
# scale-out is not capped by the limit meant to protect its neighbours; memory
# limits are 2-4x because memory is not compressible.
#
# Trailing comments are the measured `kubectl top pods` figures under gate1;
# requests round those up to the next sane floor.
resources:
  # Go services: small heaps, fast start. The 32Mi request clears the 21Mi
  # measured ceiling; the 50m CPU floor is scheduling weight, not observed
  # demand — all four idle in single-digit millicores.
  order-service:      { requests: { cpu: 50m,  memory: 32Mi },   limits: { cpu: 500m, memory: 128Mi } }  #   7m /  12Mi
  order-consumer:     { requests: { cpu: 50m,  memory: 32Mi },   limits: { cpu: 500m, memory: 128Mi } }  #  13m /  12Mi
  inventory-service:  { requests: { cpu: 50m,  memory: 32Mi },   limits: { cpu: 500m, memory: 128Mi } }  #   2m /  21Mi
  waitroom-service:   { requests: { cpu: 50m,  memory: 32Mi },   limits: { cpu: 500m, memory: 128Mi } }  #  10m /   8Mi
  # NestJS services: the V8 heap floor is why these request 4x the Go services.
  # All four sit at 58-65Mi with a warm module graph; 128Mi leaves the heap room
  # to grow before the GC gets aggressive.
  app-gateway:        { requests: { cpu: 100m, memory: 128Mi },  limits: { cpu: "1",  memory: 384Mi } }  # 100m /  63Mi
  user-service:       { requests: { cpu: 50m,  memory: 128Mi },  limits: { cpu: 500m, memory: 384Mi } }  #   8m /  59Mi
  event-service:      { requests: { cpu: 50m,  memory: 128Mi },  limits: { cpu: 500m, memory: 384Mi } }  #  16m /  58Mi
  payment-service:    { requests: { cpu: 50m,  memory: 128Mi },  limits: { cpu: 500m, memory: 384Mi } }  #   3m /  65Mi
  # Plain Node workers, no Nest module graph: half the footprint of the above.
  payment-webhook:    { requests: { cpu: 50m,  memory: 64Mi },   limits: { cpu: 500m, memory: 256Mi } }  #  12m /  23Mi
  outbox-relay:       { requests: { cpu: 50m,  memory: 64Mi },   limits: { cpu: 500m, memory: 256Mi } }  #  37m /  23Mi
  # Infra
  postgres:           { requests: { cpu: 100m, memory: 256Mi },  limits: { cpu: "1",  memory: 1Gi } }    #  41m / 141Mi
  # Redpanda's memory is not demand-driven: Seastar claims its arena at startup,
  # so 1070Mi is a floor it always holds, not a working set that shrinks when
  # idle. The request must clear it or the pod lands on a node too small for it.
  redpanda:           { requests: { cpu: 100m, memory: 1280Mi }, limits: { cpu: "1",  memory: 2Gi } }    #  16m / 1070Mi
  temporal:           { requests: { cpu: 100m, memory: 192Mi },  limits: { cpu: "1",  memory: 768Mi } }  #  59m / 103Mi
  temporal-ui:        { requests: { cpu: 25m,  memory: 32Mi },   limits: { cpu: 250m, memory: 128Mi } }  # read-only console
  redis:              { requests: { cpu: 50m,  memory: 64Mi },   limits: { cpu: 250m, memory: 256Mi } }  #  13m /   7Mi

# Static replica counts. A workload with autoscaling enabled omits `replicas`
# from its manifest entirely — see the note in _appservice.tpl.
replicas: {}

# Off everywhere by default; values-eks.yaml opts app-gateway in.
# Requires metrics-server (bundled in k3s, installed by eks-bootstrap.sh on EKS).
autoscaling:
  app-gateway:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    # Kubernetes' own default, stated explicitly because gate4a-load.sh asserts
    # the scale-down and has to wait this window out.
    scaleDownStabilizationSeconds: 300

# A PDB on a single-replica Deployment blocks `kubectl drain` indefinitely:
# minAvailable 1 against replicas 1 permits no voluntary eviction at all. Enable
# it only for workloads that have an HPA above them.
pdb: {}

# maxSkew 1 across zones, ScheduleAnyway rather than DoNotSchedule: on a
# two-node cluster a hard constraint turns a scale-out into a Pending pod.
topologySpread:
  enabled: false

# --- Observability ------------------------------------------------------------
# Off everywhere by default. With `enabled: false` the chart renders no
# ServiceMonitor and no metrics port, so a cluster without the Prometheus
# Operator installed is unaffected by this block.
monitoring:
  enabled: false
  scrapeInterval: 15s
  # Set this when kube-prometheus-stack keeps its default
  # serviceMonitorSelectorNilUsesHelmValues: true, which adopts only
  # ServiceMonitors labelled `release: <helm release name>`.
  # deploy/monitoring/values-kps.yaml sets it false, so this stays empty there.
  prometheusReleaseLabel: ""
  # Keyed by WORKLOAD name, all ten of them, every one false here; the k3s and
  # eks overlays turn them on. Note payment-webhook (rendered by
  # payment-events.yaml) and the two order Deployments.
  targets:
    order-service: false
    order-consumer: false
    inventory-service: false
    waitroom-service: false
    app-gateway: false
    user-service: false
    event-service: false
    payment-service: false
    payment-webhook: false
    outbox-relay: false
