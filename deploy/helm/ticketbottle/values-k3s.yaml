target: k3s

image:
  # registry is injected at deploy time via --set (keeps the account id out of git)
  # The box is the everyday development environment, so it tracks dev, not main.
  # Deploy another branch's build with --set image.tag=<branch, slashes as dashes>.
  tag: dev
  pullPolicy: Always

# In-cluster payment path (simulated webhook + relay), same as EKS.
paymentEvents:
  enabled: true
outboxRelay:
  enabled: true

# Modest PVCs sized for the real box.
postgres:
  storage: 5Gi
redpanda:
  storage: 5Gi
redis:
  storage: 1Gi

monitoring:
  enabled: true
  targets:
    order-service: true
    order-consumer: true
    inventory-service: true
    waitroom-service: true
    app-gateway: true
    user-service: true
    event-service: true
    payment-service: true
    payment-webhook: true
    outbox-relay: true

temporal:
  ui:
    enabled: true
