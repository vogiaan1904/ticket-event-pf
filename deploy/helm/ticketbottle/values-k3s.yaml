target: k3s

image:
  # registry and tag are set at deploy time: `make k3s-deploy` resolves ECR's
  # :dev (or REF=<branch>) to the immutable sha- build it names, so each new
  # build rolls the pods. The account id stays out of git.
  tag: dev
  pullPolicy: Always

# In-cluster payment path (simulated webhook + relay), same as EKS.
paymentEvents:
  enabled: true
outboxRelay:
  enabled: true

# Modest PVCs sized for the real box.
postgres:
  storage: 5Gi
redpanda:
  storage: 5Gi
redis:
  storage: 1Gi

monitoring:
  enabled: true
  targets:
    order-service: true
    order-consumer: true
    inventory-service: true
    waitroom-service: true
    app-gateway: true
    user-service: true
    event-service: true
    payment-service: true
    payment-webhook: true
    outbox-relay: true

temporal:
  ui:
    enabled: true
